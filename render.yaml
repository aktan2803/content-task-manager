services:
  - type: web
    name: content-task-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_TITLE
        value: "Центр запросов на обновление контента"
      - key: ADMIN_CODE
        value: "7788"
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: "1cLgPcwvf1YreHRkNPRHSzK-ZvLdWR7A8"
      - key: GOOGLE_APPS_SCRIPT_URL
        value: "https://script.google.com/macros/s/AKfycbyo_Eoi7NKmIt_jQZ-8wFPASyiEly6qWflm391FH37Wnfzv-CEFxlONf21IO03V8Vw55g/exec"
